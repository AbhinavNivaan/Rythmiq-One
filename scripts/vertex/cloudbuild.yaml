# Build and push the doc-corners training container to Artifact Registry.
#
# Usage (from repo root):
#   gcloud builds submit --config scripts/vertex/cloudbuild.yaml
#
# After this completes, run submit_job.py to kick off the Vertex AI training job.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'asia-south1-docker.pkg.dev/rythmiq-one/rythmiq-images/doc-corners-trainer:latest'
      - './scripts/vertex'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/rythmiq-one/rythmiq-images/doc-corners-trainer:latest'

images:
  - 'asia-south1-docker.pkg.dev/rythmiq-one/rythmiq-images/doc-corners-trainer:latest'

timeout: 1800s
options:
  machineType: 'E2_HIGHCPU_8'
