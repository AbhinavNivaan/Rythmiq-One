name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: '0 9 * * *' # Runs at 09:00 UTC every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: Ping Supabase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --no-save

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          (async () => {
            if (!process.env.SUPABASE_URL || !process.env.SUPABASE_KEY) {
              console.error('Missing environment variables. Please check your GitHub Secrets.');
              process.exit(1);
            }
            try {
              const { createClient } = require('@supabase/supabase-js');
              const { randomUUID } = require('crypto');
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
              
              const dummyJob = {
                job_id: randomUUID(),
                blob_id: '00000000-0000-0000-0000-000000000000',
                user_id: 'keep-alive-bot',
                state: 'FAILED'
              };

              const { data, error } = await supabase.from('jobs').insert(dummyJob).select();
              
              if (error) throw error;
              console.log('Keep-alive WRITE successful:', data);
            } catch (err) {
              console.error('Error pinging Supabase with WRITE:', err.message);
              process.exit(1);
            }
          })();
          "
