# ==============================================
# Rythmiq One - Local Development
# ==============================================
# Usage:
#   docker-compose up -d        # Start services
#   docker-compose logs -f api  # View API logs
#   docker-compose down         # Stop services
# ==============================================

version: '3.8'

services:
  # ==============================================
  # API Gateway
  # ==============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    ports:
      - "8000:8000"
    environment:
      - SERVICE_ENV=dev
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_ACCESS_KEY=${DO_SPACES_ACCESS_KEY}
      - DO_SPACES_SECRET_KEY=${DO_SPACES_SECRET_KEY}
      - CAMBER_API_URL=${CAMBER_API_URL}
      - CAMBER_API_KEY=${CAMBER_API_KEY}
      - EXECUTION_BACKEND=${EXECUTION_BACKEND:-local}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_BASE_URL=http://api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rythmiq-network

  # ==============================================
  # Local Worker (for development without Camber)
  # ==============================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_ACCESS_KEY=${DO_SPACES_ACCESS_KEY}
      - DO_SPACES_SECRET_KEY=${DO_SPACES_SECRET_KEY}
    volumes:
      - worker-data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rythmiq-network
    profiles:
      - local-worker

  # ==============================================
  # Redis (for rate limiting & caching)
  # ==============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - rythmiq-network
    profiles:
      - with-redis

networks:
  rythmiq-network:
    driver: bridge

volumes:
  worker-data:
  redis-data:
